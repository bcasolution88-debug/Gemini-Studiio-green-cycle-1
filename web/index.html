<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="绿循环 Green Cycle — 一键预约上门回收，可回收物变碳积分">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B5E20">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="绿循环">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>绿循环 Green Cycle</title>
  <link rel="manifest" href="manifest.json">
  <!-- A2: 首屏骨架 —— 在 main.dart.js 下载/初始化期间显示品牌色启动页，Flutter 首帧后自动淡出 -->
  <style>
    html,body{margin:0;height:100%;background:#F4F8F5}
    #gc-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:linear-gradient(160deg,#1B5E20 0%,#2E7D32 55%,#43A047 100%);color:#fff;z-index:9999;
      transition:opacity .35s ease;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif}
    #gc-splash.hide{opacity:0;pointer-events:none}
    #gc-splash .logo{width:96px;height:96px;border-radius:26px;background:#fff url(icons/Icon-192.png) center/70% no-repeat;
      box-shadow:0 12px 32px rgba(0,0,0,.25);margin-bottom:22px}
    #gc-splash h1{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:1px}
    #gc-splash p{margin:0;font-size:13px;opacity:.85}
    #gc-splash .bar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:28px;overflow:hidden}
    #gc-splash .bar i{display:block;width:40%;height:100%;background:#C6FF00;border-radius:2px;animation:gc 1.1s infinite}
    @keyframes gc{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
    @media (prefers-reduced-motion:reduce){#gc-splash .bar i{animation:none;width:100%}}
  </style>
</head>
<body>
  <div id="gc-splash" role="status" aria-live="polite" aria-label="绿循环加载中">
    <div class="logo" aria-hidden="true"></div>
    <h1>绿循环</h1>
    <p>回收 · 积分 · 减碳 · 美好生活</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
  <script>
    // Flutter 首帧渲染后移除骨架（flutter-first-frame 事件），超时兜底 20s
    (function(){var done=false;function hide(){if(done)return;done=true;var e=document.getElementById('gc-splash');if(!e)return;e.classList.add('hide');setTimeout(function(){e.remove()},400)}
    window.addEventListener('flutter-first-frame',hide);setTimeout(hide,20000)})();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
